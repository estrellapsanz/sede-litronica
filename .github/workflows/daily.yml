name: Check Tablón URJC

on:
  schedule:
    - cron: "0 7,13 * * 1-5"  # 7h y 13h UTC (9h y 15h España), lunes-viernes
  workflow_dispatch:            # permite lanzarlo manualmente también

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write           # necesario para commitear last_seen.txt

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Ejecutar scrí
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python check_tablon.py

      - name: Guardar last_seen.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_seen.txt
          git diff --cached --quiet || git commit -m "chore: update last_seen"
          git push
